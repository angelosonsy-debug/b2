const SKEY='b2v7';
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function defS(){return{version:7,currentDay:1,dailyRecords:{},lastCompleted:null};}
function loadS(){
  try{
    for(const k of[SKEY,'b2v6','b2v5','b2v4','b2v3']){
      const r=localStorage.getItem(k);
      if(!r)continue;
      const p=JSON.parse(r);
      if(p.version>=7)return p;
      const s=defS();
      if(p.currentDay)s.currentDay=p.currentDay;
      if(p.lastCompleted)s.lastCompleted=p.lastCompleted;
      if(p.dailyRecords)s.dailyRecords=p.dailyRecords;
      return s;
    }
  }catch{}
  return defS();
}
function saveS(s){
  try{
    const raw=JSON.stringify(s);
    localStorage.setItem(SKEY,raw);
    if(localStorage.getItem(SKEY)!==raw)throw new Error('verify failed');
    window.__saveFailed=false;
    return true;
  }catch(e){
    window.__saveFailed=true;
    try{window.dispatchEvent(new Event('b2-save-failed'));}catch(_){}
    return false;
  }
}
function cSt(t){const s=new Set(t||[]);if(s.has('core')&&s.has('optional'))return'strong';if(s.has('core')&&s.has('secondary'))return'normal';if(s.has('core'))return'partial';if(s.has('minimum'))return'minimum';return'not_started';}
function isDone(st){return['minimum','partial','normal','strong'].includes(st);}
function gapDays(ds){if(!ds)return 999;return Math.max(0,Math.floor((new Date()-new Date(ds+'T00:00:00'))/86400000));}
function bridgeCall(fn){
  const args=Array.prototype.slice.call(arguments,1);
  try{
    const raw=window.AndroidBridge[fn].apply(window.AndroidBridge,args);
    const r=JSON.parse(raw);
    return(r&&typeof r==='object')?r:{ok:false,code:'bad_response',message:'رد غير مفهوم من التطبيق'};
  }catch(e){return{ok:false,code:'bridge_error',message:'خطأ في الاتصال بالتطبيق: '+((e&&e.message)||e)};}
}
function exportData(s){
  const json=JSON.stringify(s,null,2);
  const name='b2-backup-'+today()+'.json';
  if(typeof window.AndroidBridge!=='undefined'){
    const r=bridgeCall('shareBackup',name,json);
    return r.ok?'✓ اختار مكان حفظ النسخة الاحتياطية':'❌ '+(r.message||'فشل إنشاء النسخة');
  }
  try{

}
function cleanBackup(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return null;
  if(!Number.isInteger(d.currentDay)||d.currentDay<1||d.currentDay>84)return null;
  if(!d.dailyRecords||typeof d.dailyRecords!=='object'||Array.isArray(d.dailyRecords))return null;
  if(d.lastCompleted!=null&&typeof d.lastCompleted!=='string')return null;
  const recs={};
  for(const k of Object.keys(d.dailyRecords)){
    const r=d.dailyRecords[k];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!r||typeof r!=='object'||Array.isArray(r))return null;
    if(r.completedTasks!=null&&!Array.isArray(r.completedTasks))return null;
    recs[k]=r;
  }
  return{version:7,currentDay:d.currentDay,dailyRecords:recs,lastCompleted:d.lastCompleted||null};
}
function importData(file,cb){
  const r=new FileReader();
  r.onload=function(e){
    let clean=null;
    try{clean=cleanBackup(JSON.parse(e.target.result));}catch(err){clean=null;}
    if(clean){try{const cur=localStorage.getItem(SKEY);if(cur)localStorage.setItem('b2_pre_import_backup',cur);}catch(err){}}
    cb(clean);
  };
  r.onerror=function(){cb(null);};
  r.readAsText(file);
}

function copyText(text){
  let ok=false;
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,text.length);
    ok=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ok=false;}
  if(!ok){
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){});ok=true;}}catch(e){}
  }
  return ok;
}

function useLaunchCheck(){
  const [failed,setFailed]=useState(false);

  function start(){
    setFailed(false);
    clearTimeout(t.current);
    let left=false;
    const onVis=function(){if(document.visibilityState==='hidden')left=true;};
    document.addEventListener('visibilitychange',onVis);
    t.current=setTimeout(function(){
      document.removeEventListener('visibilitychange',onVis);
      if(!left&&document.visibilityState==='visible')setFailed(true);
    },2000);
  }
  return [failed,start];
}

    // Minimum

// ─── STATS VIEW ───
function StatsView({state,setState}){
  const recs=Object.values(state.dailyRecords);
  const [toast,setToast]=useState('');
  const fileRef=useRef();
  function tk(msg){setToast(msg);setTimeout(()=>setToast(''),2200);}
  const td=today(),wk=Math.ceil(state.currentDay/7);
  const grid=useMemo(()=>{const d=[];for(let i=13;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');const r=state.dailyRecords[ds];d.push({ds,st:r?cSt(r.completedTasks):'empty'});}return d;},[state.dailyRecords]);
  const done14=grid.filter(d=>isDone(d.st)).length;
  const allRatings=recs.flatMap(r=>r.speakingRatings||[]);
  const avgF=allRatings.length?+(allRatings.reduce((a,b)=>a+(b.pauses||0),0)/allRatings.length).toFixed(1):null;
  const drillR=recs.filter(r=>r.grammarDrillScore!=null);
  const avgD=drillR.length?+(drillR.reduce((a,r)=>a+r.grammarDrillScore,0)/drillR.length).toFixed(1):null;
  const wRecs=recs.filter(r=>Math.ceil((r.day||1)/7)===wk);
  return div({padding:'16px 16px 96px'},
    div({background:C.sf,border:'1px solid '+C.br,borderRadius:14,padding:18,marginBottom:14},
      span({fontFamily:FM,fontSize:11,color:C.am,display:'block',marginBottom:8,letterSpacing:.5},'OVERALL PROGRESS'),
      div({fontSize:38,fontWeight:900,marginBottom:6},(state.currentDay-1),span({style:{fontSize:15,color:C.ft}},'/84 يوم')),
      h(Bar,{v:state.currentDay-1,t:84}),
      span({fontFamily:FM,fontSize:10,color:C.ft,display:'block',marginTop:6},'Week '+wk+' · Phase '+(WC[Math.min(wk,12)-1]?.ph||1))),
    div({display:'flex',gap:8,marginBottom:14},
      btn({flex:1,padding:'10px 0',background:C.sf,border:'1px solid '+C.br,borderRadius:9,color:C.dm,fontSize:12,display:'flex',alignItems:'center',justifyContent:'center',gap:6},()=>{tk(exportData(state));},'⬇ تحميل Backup'),
      btn({flex:1,padding:'10px 0',background:C.sf,border:'1px solid '+C.br,borderRadius:9,color:C.dm,fontSize:12,display:'flex',alignItems:'center',justifyContent:'center',gap:6},()=>fileRef.current?.click(),'⬆ استيراد'),
      h('input',{ref:fileRef,type:'file',accept:'.json',style:{display:'none'},onChange:e=>{const f=e.target.files?.[0];if(!f)return;importData(f,data=>{if(!data){tk('❌ ملف غير صالح — بياناتك الحالية ما اتغيرتش');return;}setState(data);saveS(data);tk('✓ تم الاستيراد!');});e.target.value=''}})),
    div({background:C.sf,border:'1px solid '+C.br,borderRadius:14,padding:15,marginBottom:14},
      div({display:'flex',justifyContent:'space-between',marginBottom:10},span({fontFamily:FM,fontSize:11,color:C.dm},'الاستمرارية — 14 يوم'),span({fontFamily:FM,fontSize:11,color:C.am},done14+'/14 ('+Math.round(done14/14*100)+'%)')),
      div({display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:5,marginBottom:10},...grid.map((d,i)=>{const bg=d.st==='strong'?C.pu:d.st==='normal'?C.am:d.st==='partial'?C.amd:d.st==='minimum'?C.tl:C.rs;return div({key:i,height:30,borderRadius:6,background:bg,border:d.ds===td?'2px solid '+C.tx:'1px solid '+bg});})),
      div({display:'flex',gap:12,fontSize:11,color:C.ft},...[{c:C.tl,l:'Min'},{c:C.am,l:'Normal'},{c:C.pu,l:'Strong'},{c:C.rs,l:'—'}].map(x=>div({display:'flex',alignItems:'center',gap:5},div({width:10,height:10,borderRadius:3,background:x.c}),x.l)))),
    div({display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:14},...[
      {n:wRecs.filter(r=>isDone(cSt(r.completedTasks))).length,l:'أيام الأسبوع',c:C.am},
      {n:avgF!==null?avgF+'/5':'-',l:'طلاقة Speaking',c:C.tl},
      {n:avgD!==null?avgD+'/5':'-',l:'Grammar Drill',c:C.rd},
    ].map(s=>div({background:C.sf,border:'1px solid '+C.br,borderRadius:10,padding:'12px 8px',textAlign:'center'},div({fontSize:22,fontWeight:900,color:s.c},s.n),div({fontSize:10,color:C.ft,marginTop:3},s.l)))),
    h(Toast,{msg:toast}));
}

// ─── HISTORY VIEW ───
function HistoryView({state}){
  const recs=Object.values(state.dailyRecords).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const [exp,setExp]=useState(null);
  if(!recs.length)return div({padding:'60px 20px',textAlign:'center',color:C.ft,fontSize:14},'مفيش سجلات بعد!');
  return div({padding:'16px 16px 96px'},
    span({fontFamily:FM,fontSize:11,color:C.dm,display:'block',marginBottom:12},recs.length+' يوم مسجّل'),
    div({display:'flex',flexDirection:'column',gap:8},...recs.map((r)=>{
      const st=cSt(r.completedTasks),plan=getDayPlan(r.day),isExp=exp===r.date;
      return div({key:r.date},
        btn({width:'100%',background:C.sf,border:'1px solid '+C.br,borderRadius:10,padding:'13px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',color:C.tx},()=>setExp(isExp?null:r.date),
          div({textAlign:'right'},
            span({fontFamily:FM,fontSize:10,color:C.ft,display:'block',marginBottom:3},r.date),
            span({fontSize:14,fontWeight:700,display:'block'},'يوم '+r.day+' — '+(plan?.theme||'')),
            div({fontSize:11,color:C.ft,marginTop:3},(r.speakingRatings?.length?'🗣'+r.speakingRatings.length+' ':''),(r.grammarDrillScore!=null?'🧠'+r.grammarDrillScore+'/5 ':''))),
          div({display:'flex',alignItems:'center',gap:10},h(Badge,{st}),span({fontSize:12,color:C.ft},isExp?'▲':'▼'))),
        isExp?div({className:'fade',background:C.rs,border:'1px solid '+C.br,borderTop:'none',borderRadius:'0 0 10px 10px',padding:'13px 14px'},
          plan?div({fontSize:13,color:C.dm,marginBottom:8,lineHeight:1.7},'الهدف: '+plan.goal):null,
          (r.speakingRatings||[]).map((rt,j)=>div({fontSize:12,color:C.am,marginBottom:3,key:j},'Speaking '+(j+1)+': طلاقة '+rt.pauses+'/5 · عبارات '+rt.phrases+'/5 · إجمالي '+rt.overall+'/5')),
          r.grammarDrillScore!=null?div({fontSize:12,color:C.rd,marginTop:4},'Grammar Drill: '+r.grammarDrillScore+'/5'):null,
          (r.weaknesses||[]).length?div({fontSize:12,color:C.rd,marginTop:4},'نقاط الضعف: '+r.weaknesses.join(' · ')):null,
          r.notes?div({fontSize:13,color:C.dm,borderTop:'1px solid '+C.br,paddingTop:10,marginTop:10,lineHeight:1.7},r.notes):null):null);})));
}

// ─── APP ───
function App(){
  const [state,setState]=useState(()=>loadS());
  const [screen,setScreen]=useState('today');
  const [saveFail,setSaveFail]=useState(false);
  useEffect(()=>{const f=()=>setSaveFail(true);window.addEventListener('b2-save-failed',f);return()=>window.removeEventListener('b2-save-failed',f);},[]);
  useEffect(()=>{saveS(state);},[state]);
  const tabs=[{id:'today',l:'اليوم',ic:'🏠'},{id:'stats',l:'تقدم',ic:'📊'},{id:'history',l:'السجل',ic:'🕐'}];
  return h('div',{style:{maxWidth:480,margin:'0 auto',minHeight:'100vh'}},
    saveFail?div({position:'fixed',top:0,left:0,right:0,zIndex:400,background:C.rd,color:C.bg,padding:'10px 14px',fontSize:13,fontWeight:700,textAlign:'center'},'⚠️ تعذّر حفظ بياناتك على الجهاز — خد Backup دلوقتي'):null,
    h('div',{style:{height:'100vh',overflowY:'auto',paddingBottom:64}},
      screen==='today'?h(TodayView,{state,setState}):
      screen==='stats'?h(StatsView,{state,setState}):
      h(HistoryView,{state})),
    h('div',{style:{position:'fixed',bottom:0,left:0,right:0,background:C.bg,borderTop:'1px solid '+C.br,display:'flex',paddingBottom:'env(safe-area-inset-bottom,0px)',zIndex:100}},
      ...tabs.map(t=>btn({flex:1,padding:'11px 0 9px',display:'flex',flexDirection:'column',alignItems:'center',gap:3,color:screen===t.id?C.am:C.ft},()=>setScreen(t.id),
        h('span',{style:{fontSize:21}},t.ic),h('span',{style:{fontSize:10,fontWeight:screen===t.id?700:400}},t.l)))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
